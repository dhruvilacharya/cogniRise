spring.datasource.url=jdbc:h2:mem:cognirise-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

spring.ai.google.genai.api-key=test-api-key
spring.ai.google.genai.embedding.api-key=test-api-key
spring.ai.vectorstore.pgvector.initialize-schema=false

spring.security.oauth2.client.registration.github.client-id=test-client-id
spring.security.oauth2.client.registration.github.client-secret=test-client-secret
app.token-encryptor-password=test-token-encryption-password
app.token-encryptor-salt=0123456789abcdef
